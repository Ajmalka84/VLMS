<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />
  
  <!-- Subtle Glow Accent -->
  <circle cx="256" cy="240" r="160" fill="#f59e0b" fill-opacity="0.08" filter="url(#amberGlow)" />

  <!-- Quarry Tipper Truck Body -->
  <g transform="translate(64, 96)">
    <!-- Chassis / Wheels Base -->
    <path d="M 40 220 L 344 220 C 352 220 360 212 360 200 L 360 160 L 260 160 L 250 80 C 248 68 238 60 226 60 L 40 60 C 28 60 18 70 18 82 L 18 200 C 18 212 28 220 40 220 Z" 
          fill="url(#shieldGrad)" stroke="#475569" stroke-width="6" />

    <!-- Dump Bed (Amber Highlight) -->
    <path d="M 28 72 L 232 72 L 212 152 L 28 152 Z" 
          fill="url(#amberGrad)" />
    
    <!-- Dump Ribs -->
    <line x1="80" y1="72" x2="72" y2="152" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
    <line x1="130" y1="72" x2="122" y2="152" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
    <line x1="180" y1="72" x2="172" y2="152" stroke="#b45309" stroke-width="5" stroke-linecap="round" />

    <!-- Truck Cab Window & Door -->
    <path d="M 264 90 L 320 90 C 330 90 338 98 340 108 L 344 146 L 264 146 Z" 
          fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="4" />

    <!-- Headlight with Glow -->
    <rect x="350" y="160" width="16" height="24" rx="4" fill="#fbbf24" filter="url(#amberGlow)" />

    <!-- Wheel 1 (Front) -->
    <g transform="translate(300, 220)">
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#64748b" stroke-width="8" />
      <circle cx="0" cy="0" r="22" fill="#1e293b" />
      <circle cx="0" cy="0" r="10" fill="#f59e0b" />
    </g>

    <!-- Wheel 2 (Rear) -->
    <g transform="translate(90, 220)">
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#64748b" stroke-width="8" />
      <circle cx="0" cy="0" r="22" fill="#1e293b" />
      <circle cx="0" cy="0" r="10" fill="#f59e0b" />
    </g>

    <!-- Wheel 3 (Middle Rear) -->
    <g transform="translate(170, 220)">
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#64748b" stroke-width="8" />
      <circle cx="0" cy="0" r="22" fill="#1e293b" />
      <circle cx="0" cy="0" r="10" fill="#f59e0b" />
    </g>
  </g>

  <!-- VLMS Brand Wordmark at Bottom -->
  <text x="256" y="430" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="52" 
        letter-spacing="6" 
        fill="#f8fafc" 
        text-anchor="middle">
    VLMS
  </text>
  <text x="256" y="465" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="18" 
        letter-spacing="4" 
        fill="#f59e0b" 
        text-anchor="middle">
    QUARRY OS
  </text>
</svg>
